server:
  port: 8080
  servlet:
    context-path: /api

spring:
  # 文件上传大小限制
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 200MB

  # Jackson 配置
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.kaipai.model.**.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

# JWT 配置
jwt:
  secret: kaipai-secret-key-2024-must-be-at-least-32-characters-long
  expire: 7

wechat:
  miniapp:
    app-id: ${WECHAT_MINIAPP_APP_ID:}
    app-secret: ${WECHAT_MINIAPP_APP_SECRET:}
    env-version: ${WECHAT_MINIAPP_ENV_VERSION:develop}

tencent:
  secret-id: ${TENCENT_CLOUD_SECRET_ID:}
  secret-key: ${TENCENT_CLOUD_SECRET_KEY:}
  faceid:
    enabled: ${TENCENT_FACEID_ENABLED:false}
    endpoint: ${TENCENT_FACEID_ENDPOINT:https://faceid.tencentcloudapi.com}
    version: ${TENCENT_FACEID_VERSION:2018-03-01}
    connect-timeout-ms: ${TENCENT_FACEID_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${TENCENT_FACEID_READ_TIMEOUT_MS:10000}
  cos:
    region: ${TENCENT_COS_REGION:}
    bucket-name: ${TENCENT_COS_BUCKET_NAME:}

kaipai:
  cors:
    allowed-origins:
      - https://kplyyk.com
      - https://api.kplyyk.com
      - http://127.0.0.1:5100
      - http://localhost:5100
  sms:
    provider-code: ${KAIPAI_SMS_PROVIDER_CODE:tencent}
    code-expire-minutes: ${KAIPAI_SMS_CODE_EXPIRE_MINUTES:10}
    tencent:
      endpoint: ${TENCENT_SMS_ENDPOINT:https://sms.tencentcloudapi.com}
      region: ${TENCENT_SMS_REGION:ap-guangzhou}
      version: ${TENCENT_SMS_VERSION:2021-01-11}
      secret-id: ${TENCENT_CLOUD_SECRET_ID:}
      secret-key: ${TENCENT_CLOUD_SECRET_KEY:}
      sms-sdk-app-id: ${TENCENT_SMS_SDK_APP_ID:}
      sign-name: ${TENCENT_SMS_SIGN_NAME:}
      template-id: ${TENCENT_SMS_LOGIN_TEMPLATE_ID:}
      template-param-mode: ${TENCENT_SMS_TEMPLATE_PARAM_MODE:code}
      connect-timeout-ms: ${TENCENT_SMS_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${TENCENT_SMS_READ_TIMEOUT_MS:10000}
  realname:
    provider-code: ${KAIPAI_REALNAME_PROVIDER_CODE:tencent}
    tencent:
      endpoint: ${TENCENT_FACEID_ENDPOINT:https://faceid.tencentcloudapi.com}
      version: ${TENCENT_FACEID_VERSION:2018-03-01}
      secret-id: ${TENCENT_CLOUD_SECRET_ID:}
      secret-key: ${TENCENT_CLOUD_SECRET_KEY:}
      connect-timeout-ms: ${TENCENT_FACEID_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${TENCENT_FACEID_READ_TIMEOUT_MS:10000}
  identity:
    id-card-cipher-key: ${KAIPAI_ID_CARD_CIPHER_KEY:}
  ai:
    profile-card:
      provider-code: ${AI_PROFILE_CARD_PROVIDER_CODE:kplyyk}
      generation-mode: image_to_image
      estimated-ready-minutes: 10
      cover-quality-gate-enabled: ${AI_PROFILE_CARD_COVER_QUALITY_GATE_ENABLED:true}
      cover-quality-max-attempts: ${AI_PROFILE_CARD_COVER_QUALITY_MAX_ATTEMPTS:3}
      kplyyk:
        endpoint: ${AI_PROFILE_CARD_KPLYYK_ENDPOINT:http://kplyyk.com/v0/management/image-generation/test}
        auth-header: ${AI_PROFILE_CARD_KPLYYK_AUTH_HEADER:Authorization}
        auth-token: ${AI_PROFILE_CARD_KPLYYK_AUTH_TOKEN:}
        model: gpt-image-2
        size: 2160x3840
        quality: high
        count: 1
        connect-timeout-ms: ${AI_PROFILE_CARD_KPLYYK_CONNECT_TIMEOUT_MS:10000}
        read-timeout-ms: ${AI_PROFILE_CARD_KPLYYK_READ_TIMEOUT_MS:120000}
        poll-interval-ms: ${AI_PROFILE_CARD_KPLYYK_POLL_INTERVAL_MS:1500}
        max-poll-attempts: ${AI_PROFILE_CARD_KPLYYK_MAX_POLL_ATTEMPTS:400}
    resume:
      notification:
        enabled: false
        provider-code: manual
        callback-header: ${AI_RESUME_NOTIFICATION_CALLBACK_HEADER:X-Kaipai-Ai-Notification-Token}
        callback-token: ${AI_RESUME_NOTIFICATION_CALLBACK_TOKEN:}
        callback-url: ${AI_RESUME_NOTIFICATION_CALLBACK_URL:}
        http:
          endpoint: ${AI_RESUME_NOTIFICATION_HTTP_ENDPOINT:}
          auth-header: ${AI_RESUME_NOTIFICATION_HTTP_AUTH_HEADER:Authorization}
          auth-token: ${AI_RESUME_NOTIFICATION_HTTP_AUTH_TOKEN:}
          connect-timeout-ms: ${AI_RESUME_NOTIFICATION_HTTP_CONNECT_TIMEOUT_MS:5000}
          read-timeout-ms: ${AI_RESUME_NOTIFICATION_HTTP_READ_TIMEOUT_MS:10000}
      governance-scheduler:
        enabled: false
        initial-delay: 2m
        fixed-delay: 15m
        limit: 20
        lock-ttl: 14m
        reason: AI治理定时sweep

# Knife4j API 文档配置
knife4j:
  enable: true
  setting:
    language: zh_cn
